<h1 class="mat-font-headline-lg">ngx-speech-button</h1>
<p class="mat-font-body-md">
  Speech recognition {{ mic.available() ? 'supported.' : ' is not supported.' }}
</p>
<form class="demo__form" [formGroup]="formGroup">
  <mat-form-field class="demo__prompt" appearance="outline">
    <mat-label>Prompt</mat-label>
    @if (mic.listening()) {
      <button
        mat-icon-button
        matPrefix
        type="button"
        color="warn"
        ngxSpeechButton
        class="demo__abort"
        matTooltip="abort recording"
      >
        <mat-icon>cancel</mat-icon>
      </button>
    }
    <textarea
      matInput
      placeholder="Prompt"
      cdkTextareaAutosize
      #autosize="cdkTextareaAutosize"
      cdkAutosizeMinRows="4"
      cdkAutosizeMaxRows="35"
      formControlName="prompt"
      style="max-height: unset !important"
    ></textarea>
    <button
      mat-icon-button
      matSuffix
      type="button"
      color="accent"
      ngxSpeechButton
      #mic="ngxSpeechButton"
      [disabled]="!mic.available()"
      class="demo__mic"
      (error)="onError($event)"
      [class.demo__mic--listening]="mic.listening()"
      (transcriptChanged)="updateTranscript($event)"
      (transcriptCompleted)="updateForm($event)"
      [matTooltip]="mic.listening() ? 'stop recording' : 'start recording'"
    >
      <mat-icon>mic</mat-icon>
    </button>
  </mat-form-field>
</form>
<h2>transcript</h2>
<p class="demo__transcript">{{ transcript() }}</p>
