<h1>ngx-speech-button</h1>
<p class="mat-body-medium">
  Speech recognition {{ mic.available() ? 'supported.' : ' is not supported.' }}
</p>
<form class="demo__form" [formGroup]="formGroup">
  <mat-form-field class="demo__prompt" appearance="outline">
    <mat-label>Prompt</mat-label>
    <textarea
      matInput
      placeholder="Prompt"
      cdkTextareaAutosize
      #autosize="cdkTextareaAutosize"
      cdkAutosizeMinRows="4"
      cdkAutosizeMaxRows="35"
      formControlName="prompt"
      style="max-height: unset !important"
    ></textarea>
    <button
      mat-icon-button
      matSuffix
      type="button"
      color="accent"
      appSpeechButton
      #mic="appSpeechButton"
      [disabled]="!mic.available()"
      class="demo__mic"
      [class.chat-request__mic--listening]="mic.listening()"
      (transcriptReady)="write($event)"
    >
      <mat-icon>mic</mat-icon>
    </button>
  </mat-form-field>
</form>
